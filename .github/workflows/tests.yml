name: Motor multimodal
on: [push, pull_request]
jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install fastapi uvicorn 'pydantic>=2,<3' pytest httpx matplotlib numpy nltk opencv-python-headless Pillow pyarrow
      - run: python -m pytest backend/tests -q --junitxml=tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests
          path: tests.xml
